<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdullah Binsalman</title>
<meta name="description" content="Abdullah Binsalman – Electrical & Computer Engineer. CV and LinkedIn.">
<style>
  :root{--navy:#1b2547;--bg:#f5f6fa;--muted:#5b6275}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:100%;max-width:420px;text-align:center}
  .avatar{width:88px;height:88px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px;margin:0 auto 18px}
  h1{margin:0;font-size:28px}
  p{margin:6px 0 30px;color:var(--muted);font-size:16px}
  a.btn{display:block;padding:16px 20px;margin-bottom:14px;border-radius:14px;font-size:17px;font-weight:600;text-decoration:none;transition:transform .1s}
  a.btn:active{transform:scale(.98)}
  .cv{background:var(--navy);color:#fff}
  .li{background:#fff;color:var(--navy);border:2px solid var(--navy)}
</style>
</head>
<body>
<main>
  <div class="avatar">AB</div>
  <h1>Abdullah Binsalman</h1>
  <p>Electrical &amp; Computer Engineer</p>
  <a class="btn cv" href="Abdullah_Binsalman_CV.pdf">View my CV</a>
  <a class="btn li" href="https://www.linkedin.com/in/abdullah-binsalman/">LinkedIn</a>
</main>
</body>
</html>
